name: LE TOTE
description: >-
  Le Tote was an online women's clothing rental and subscription-box business
  founded in San Francisco in 2012 by Brett Northart and Rakesh Tondon, and a
  member of the Y Combinator Summer 2013 batch. Unlike Rent the Runway, which
  concentrated on high-end event wear, Le Tote rented everyday apparel and
  accessories through a rotating personalized "tote" driven by its own sizing and
  recommendation data. In August 2019 it agreed to acquire the Lord & Taylor
  department-store chain from Hudson's Bay Company; both businesses filed for
  Chapter 11 bankruptcy on 2 August 2020, and Saadia Group bought the assets that
  October. Saadia Group was reported effectively shut down in March 2024 and the
  letote.com site went offline that spring. Le Tote is defunct: the domain no
  longer resolves, and the company never published a public API or developer
  portal. This profile is retained as a historical record of its open-source
  engineering output.
